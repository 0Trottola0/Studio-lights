<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luci">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Luci Ufficio</title>
<style>
  :root {
    --bg: #f4f4f1; --card: #ffffff; --text: #1b1c1f; --muted: #6b6e76;
    --line: #e2e2dd; --accent: #e8a33d; --off: #c9cad0; --danger: #c2453a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1e2127; --text: #eceef2; --muted: #9096a1;
      --line: #2c3038; --accent: #f0b04f; --off: #3a3f48; --danger: #e0685d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           flex-wrap: wrap; max-width: 720px; margin: 0 auto 16px; }
  h1 { font-size: 22px; margin: 0; }
  .actions { display: flex; gap: 8px; }
  button.pill {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  button.pill:active { transform: scale(.97); }
  main { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .bulb { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--off);
          transition: background .2s, box-shadow .2s; }
  .card.on .bulb { box-shadow: 0 0 18px var(--glow, var(--accent)); }
  .name { flex: 1; min-width: 0; }
  .name b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name small { color: var(--muted); }
  .card.offline { opacity: .6; }
  .card.offline small { color: var(--danger); }
  /* interruttore */
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: var(--off); border-radius: 999px; transition: background .2s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
                        border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(22px); }
  .controls { display: grid; gap: 12px; margin-top: 14px; }
  .controls[hidden] { display: none; }
  label.ctl { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 10px;
              font-size: 14px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input.temp { accent-color: #f3c27a; }
  .colours { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .picker { position: relative; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line);
            background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); cursor: pointer; }
  .picker input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  .card.master { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .master .bulb { background: conic-gradient(#ffd9a8, #fff3e0, #ffd9a8); }
  .master .bulb.lit { box-shadow: 0 0 18px var(--glow, var(--accent)); }
  .seg { display: flex; gap: 6px; }
  .copy { justify-self: start; font-size: 13px; padding: 6px 12px; color: var(--muted); }
  .section-label { max-width: 720px; margin: 8px auto 0; font-size: 13px; color: var(--muted);
                   text-transform: uppercase; letter-spacing: .04em; }
  .msg { text-align: center; color: var(--muted); padding: 32px 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0;
           transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Luci Ufficio</h1>
  <button class="pill" id="refresh" aria-label="Aggiorna">↻ Aggiorna</button>
</header>
<main>
  <section class="card master" id="all">
    <div class="row">
      <div class="bulb"></div>
      <div class="name"><b>Tutte le lampadine</b><small id="all-sum"></small></div>
      <div class="seg">
        <button class="pill" data-all="on">On</button>
        <button class="pill" data-all="off">Off</button>
      </div>
    </div>
    <div class="controls" data-slot="controls"></div>
  </section>
  <p class="section-label">Singole lampadine</p>
  <div id="list" style="display:grid;gap:12px"><p class="msg">Caricamento…</p></div>
</main>
<div class="toast" id="toast"></div>

<template id="tpl">
  <section class="card">
    <div class="row">
      <div class="bulb"></div>
      <div class="name"><b></b><small></small></div>
      <label class="switch"><input type="checkbox" aria-label="Accendi/spegni"><span></span></label>
    </div>
    <div class="controls" data-slot="controls"></div>
  </section>
</template>

<template id="tpl-controls">
  <div>
      <label class="ctl bri">Luminosità <input type="range" min="1" max="100"></label>
      <label class="ctl tmp">Bianco <input class="temp" type="range" min="0" max="100"
             title="caldo ← → freddo"></label>
      <div class="ctl col colours">
        <button class="sw" style="background:#ff3b30" data-c="#ff3b30" aria-label="Rosso"></button>
        <button class="sw" style="background:#ff9500" data-c="#ff9500" aria-label="Arancio"></button>
        <button class="sw" style="background:#ffd60a" data-c="#ffd60a" aria-label="Giallo"></button>
        <button class="sw" style="background:#34c759" data-c="#34c759" aria-label="Verde"></button>
        <button class="sw" style="background:#0a84ff" data-c="#0a84ff" aria-label="Blu"></button>
        <button class="sw" style="background:#bf5af2" data-c="#bf5af2" aria-label="Viola"></button>
        <label class="picker" title="Altro colore"><input type="color" aria-label="Colore personalizzato"></label>
      </div>
  </div>
</template>

<script>
const $ = (s, r = document) => r.querySelector(s);
const list = $("#list");
let lights = [];
let pin = "";
try { pin = localStorage.getItem("luci-pin") || ""; } catch (e) {}

function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800);
}

async function api(path, body) {
  const opts = { headers: { "X-Pin": pin } };
  if (body) { opts.method = "POST"; opts.body = JSON.stringify(body);
              opts.headers["Content-Type"] = "application/json"; }
  const res = await fetch(path, opts);
  if (res.status === 401) {
    const p = prompt("PIN:");
    if (p === null) throw new Error("PIN richiesto");
    pin = p.trim(); try { localStorage.setItem("luci-pin", pin); } catch (e) {}
    return api(path, body);
  }
  const data = await res.json();
  if (!res.ok || data.ok === false) throw new Error(data.error || "errore");
  return data;
}

// Colore "acceso" del pallino in base allo stato
function glow(l) {
  if (!l.on) return "";
  if (l.mode === "colour" && l.colour) return l.colour;
  const t = (l.temp ?? 50) / 100; // 0 caldo → 1 freddo
  return `rgb(255,${Math.round(190 + 60 * t)},${Math.round(120 + 135 * t)})`;
}

// Monta slider e colori dentro una scheda e collega gli eventi
function mountControls(root, h) {
  const box = $("#tpl-controls").content.firstElementChild.cloneNode(true);
  const slot = $("[data-slot=controls]", root);
  slot.replaceChildren(...box.childNodes);
  $(".bri input", slot).addEventListener("change", e => h.brightness(+e.target.value));
  $(".tmp input", slot).addEventListener("change", e => h.temp(+e.target.value));
  slot.querySelectorAll(".sw").forEach(b => b.addEventListener("click", () => h.colour(b.dataset.c)));
  $("input[type=color]", slot).addEventListener("change", e => h.colour(e.target.value));
  if (h.copy) {
    const btn = document.createElement("button");
    btn.className = "pill copy"; btn.textContent = "⧉ Copia su tutte";
    btn.title = "Applica colore e intensità di questa lampadina a tutte le altre";
    btn.addEventListener("click", h.copy);
    slot.append(btn);
  }
}

function setSliders(root, v) {
  if (v.brightness != null) $(".bri input", root).value = v.brightness;
  if (v.temp != null) $(".tmp input", root).value = v.temp;
  if (v.colour) $("input[type=color]", root).value = v.colour;
}

function paint(card, l) {
  card.classList.toggle("on", !!l.on);
  card.classList.toggle("offline", !l.online);
  $(".name b", card).textContent = l.name;
  $(".name small", card).textContent = !l.online ? "Non raggiungibile"
    : l.on ? (l.brightness != null ? `Accesa · ${l.brightness}%` : "Accesa") : "Spenta";
  const g = glow(l);
  $(".bulb", card).style.background = g || "";
  card.style.setProperty("--glow", g || "transparent");
  const sw = $(".switch input", card);
  sw.checked = !!l.on; sw.disabled = !l.online;
  $(".controls", card).hidden = !l.online || !l.on;
  $(".bri", card).hidden = !l.has_brightness;
  $(".tmp", card).hidden = !l.has_temp;
  $(".col", card).hidden = !l.has_colour;
  setSliders(card, l);
}

function cardOf(l) { return list.querySelector(`[data-id="${l.id}"]`); }

async function send(l, cmd, optimistic) {
  const card = cardOf(l), prev = { ...l };
  Object.assign(l, optimistic); paint(card, l); paintMaster();
  try { await api(`/api/lights/${l.id}`, cmd); }
  catch (e) { Object.assign(l, prev); paint(card, l); paintMaster(); toast(`${l.name}: ${e.message}`); }
}

// Invia lo stesso comando a tutte le lampadine raggiungibili
async function sendAll(cmd, optimistic, okText) {
  const targets = lights.filter(l => l.online);
  if (!targets.length) return toast("Nessuna lampadina raggiungibile");
  targets.forEach(l => { Object.assign(l, optimistic); paint(cardOf(l), l); });
  paintMaster();
  try {
    const { results } = await api("/api/all", cmd);
    const ko = results.filter(r => !r.ok && lights.find(l => l.id === r.id)?.online);
    toast(ko.length ? `${ko.length} lampadine non hanno risposto` : okText);
  } catch (e) { toast(e.message); }
  setTimeout(load, 800); // riallinea con lo stato reale
}

// Valori della scheda "Tutte": presi dalla prima lampadina accesa
const master = { brightness: 80, temp: 50 };
function paintMaster() {
  const online = lights.filter(l => l.online), on = online.filter(l => l.on);
  $("#all-sum").textContent = !lights.length ? "" :
    `${on.length} accese su ${lights.length}` + (online.length < lights.length ? ` · ${lights.length - online.length} non raggiungibil${lights.length - online.length === 1 ? "e" : "i"}` : "");
  const ref = on[0];
  if (ref) { master.brightness = ref.brightness ?? master.brightness; master.temp = ref.temp ?? master.temp; }
  const all = $("#all");
  $(".bulb", all).classList.toggle("lit", on.length > 0);
  $(".bri", all).hidden = !online.some(l => l.has_brightness);
  $(".tmp", all).hidden = !online.some(l => l.has_temp);
  $(".col", all).hidden = !online.some(l => l.has_colour);
  $(".controls", all).hidden = !online.length;
  setSliders(all, master);
}

mountControls($("#all"), {
  brightness: v => { master.brightness = v;
    sendAll({ action: "brightness", value: v }, { brightness: v }, `Intensità ${v}% su tutte`); },
  temp: v => { master.temp = v;
    sendAll({ action: "white", temp: v, brightness: master.brightness },
            { temp: v, mode: "white", on: true }, "Bianco applicato a tutte"); },
  colour: c => sendAll({ action: "colour", hex: c, brightness: master.brightness },
                       { colour: c, mode: "colour", on: true }, "Colore applicato a tutte"),
});

function build(l) {
  const card = $("#tpl").content.firstElementChild.cloneNode(true);
  card.dataset.id = l.id;
  list.append(card);
  $(".switch input", card).addEventListener("change", e =>
    send(l, { action: "power", on: e.target.checked }, { on: e.target.checked }));
  mountControls(card, {
    brightness: v => send(l, { action: "brightness", value: v }, { brightness: v }),
    temp: v => send(l, { action: "white", temp: v, brightness: l.brightness ?? 100 }, { temp: v, mode: "white" }),
    colour: c => send(l, { action: "colour", hex: c, brightness: l.brightness ?? 100 }, { colour: c, mode: "colour" }),
    copy: () => {
      const colour = l.mode === "colour" && l.colour;
      sendAll({ action: "scene", on: true, mode: colour ? "colour" : "white", hex: l.colour,
                brightness: l.brightness ?? 100, temp: l.temp ?? 50 },
              { on: true, mode: colour ? "colour" : "white", colour: l.colour,
                brightness: l.brightness, temp: l.temp },
              `Impostazioni di "${l.name}" copiate su tutte`);
    },
  });
  paint(card, l);
}

async function load() {
  try {
    ({ lights } = await api("/api/lights"));
    list.replaceChildren();
    lights.forEach(build);
    if (!lights.length) list.innerHTML = '<p class="msg">Nessuna lampadina.</p>';
  } catch (e) {
    list.innerHTML = `<p class="msg">Impossibile contattare il server: ${e.message}</p>`;
  }
  paintMaster();
}

document.querySelectorAll("[data-all]").forEach(b => b.addEventListener("click", () => {
  const on = b.dataset.all === "on";
  sendAll({ action: "power", on }, { on }, on ? "Tutte accese" : "Tutte spente");
}));
$("#refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
